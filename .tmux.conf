# Configuration Protocol
set -g default-terminal "screen-256color"
set-option -sa terminal-overrides ",xterm*:Tc"

# System Execution Triggers
bind-key r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded."
bind-key L clear-history

# Window & Pane Layout Indexing
set -g base-index 1
set-window-option -g pane-base-index 1
set-window-option -g automatic-rename on
set-option -g set-titles on

# Multiplexer Timing Adjustments
set-option -g display-time 2000
set-option -g display-panes-time 3000
set-option -g repeat-time 0
set -sg escape-time 0

# Input Controls & Interactive Mouse Mapping
set -g mouse on
setw -g mode-keys vi

# Native OSC 52 Clipboard Bridge Integration
set -g set-clipboard on
unbind p
bind p paste-buffer
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel

# Navigation Overrides (No Prefix)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
bind -n S-Left previous-window
bind -n S-Right next-window

# Layout Management Splits
bind-key v split-window -h -c "#{pane_current_path}"
bind-key h split-window -v -c "#{pane_current_path}"
bind-key y set-window-option synchronize-panes

# System Metrics Monitoring
setw -g monitor-activity on
set -g visual-activity on

# Interface Cosmetics & Geometry Colors
set -g window-status-current-style bold,bg=colour247,fg=colour237
set -g window-status-activity-style bg=blue,fg=black
set-option -g message-style bg=colour32,fg=colour248
set-option -g pane-border-style fg=colour248
set-option -g pane-active-border-style fg=colour248

# Status Panel Topology Definitions
set -g status-justify centre
set -g status-bg black
set -g status-fg white
set -g status-interval 60
set -g status-left-length 30
set -g status-left '#[fg=colour248]#[bg=colour32,bold] #H #[bg=colour237] #[fg=colour247,nobold][#S] '
set -g status-right '#[bg=colour237]#[fg=colour247] #(uptime | awk -F "load average:" "{print \$2}" | sed "s/,//g")#[default]#[bg=colour237] #[bg=colour32]#[fg=colour248,bold] %H:%M'