# yaml-language-server: $schema=https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json
version: 3
final_space: true
transient_prompt:
  template: ' '
  foreground: '#22da6e'
  background: transparent
upgrade:
  source: cdn
  interval: 168h
  auto: true
  notice: false
console_title_template: '{{ .Folder }}'
blocks:
  - type: prompt
    alignment: left
    segments:
      - type: os
        style: diamond
        leading_diamond: ╭─
        trailing_diamond: 
        foreground: '#011627'
        background: '#242424'
        template: ' {{ if .Env.WSL_DISTRO_NAME }}WSL: {{ end }}{{ .Icon }} '
        properties:
          windows: 

      - type: root
        style: powerline
        powerline_symbol: 
        foreground: '#ffeb95'
        background: '#ef5350'
        template: '  '

      - type: path
        style: powerline
        powerline_symbol: 
        foreground: '#011627'
        background: '#525252'
        template: ' {{ .Path }} '
        properties:
          folder_icon: ' '
          folder_separator_icon: '  '
          home_icon: '  '
          style: agnoster

      - type: git
        style: powerline
        powerline_symbol: 
        foreground: '#011627'
        background: '#addb67'
        template: ' {{ .UpstreamIcon }}{{ .HEAD }}{{ if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }}  {{ .Working.String }}{{ end }}{{ if .Staging.Changed }}  {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }}  {{ .StashCount }}{{ end }} '
        properties:
          branch_icon: ' '
          fetch_status: true
          fetch_upstream_icon: true
          fetch_worktree_count: true
        background_templates:
          - '{{ if or (.Working.Changed) (.Staging.Changed) }}#e4cf6a{{ end }}'
          - '{{ if and (gt .Ahead 0) (gt .Behind 0) }}#f78c6c{{ end }}'
          - '{{ if gt .Ahead 0 }}#C792EA{{ end }}'
          - '{{ if gt .Behind 0 }}#c792ea{{ end }}'

  - type: prompt
    alignment: right
    overflow: break
    segments:
      - type: executiontime
        style: diamond
        leading_diamond: 
        trailing_diamond: 
        foreground: '#d6deeb'
        background: '#575656'
        template: ' {{ .FormattedMs }} '
        properties:
          threshold: 0

      - type: node
        style: diamond
        leading_diamond: 
        trailing_diamond: 
        foreground: '#3C873A'
        background: '#303030'
        template: '  {{ .Full }} '

      - type: time
        style: diamond
        leading_diamond: 
        trailing_diamond: 
        foreground: '#d6deeb'
        background: '#234d70'
        template: '  {{ .CurrentDate | date .Format }} '
        properties:
          time_format: '15:04'

  - type: prompt
    alignment: left
    newline: true
    segments:
      - type: text
        style: plain
        foreground: '#21c7a8'
        template: '╰─'

      - type: status
        style: plain
        foreground: '#22da6e'
        foreground_templates:
          - '{{ if gt .Code 0 }}#ef5350{{ end }}'
        template: ''
        properties:
          always_enabled: true